<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <style>
      .bg { fill: #1A1410; stroke: #FF5600; stroke-width: 2; }
      .grid { stroke: #251D17; stroke-width: 1; }
      .tag { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #FF5600; font-weight: 700; letter-spacing: 1.5px; }
      .badge-bg { fill: #251D17; stroke: #FF5600; stroke-width: 1; }
      .badge-txt { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #FEEFD9; font-weight: 700; letter-spacing: 1px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 38px; fill: #FEEFD9; font-weight: 900; letter-spacing: 2px; }
      .title-accent { fill: #FF5600; }
      .sub { font-family: 'Courier New', Courier, monospace; font-size: 13px; fill: #FEEFD9; opacity: 0.75; letter-spacing: 1px; }
      .corner { stroke: #FF5600; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="796" height="196" class="bg" rx="4"/>

  <!-- Subtle Industrial Grid Lines -->
  <line x1="20" y1="50" x2="780" y2="50" class="grid"/>
  <line x1="20" y1="150" x2="780" y2="150" class="grid"/>

  <!-- Top Tags -->
  <text x="32" y="34" class="tag">MOD-07 // RECLAIM ENGINE</text>

  <!-- Badge Right -->
  <rect x="630" y="20" width="138" height="20" rx="3" class="badge-bg"/>
  <text x="642" y="34" class="badge-txt">= 0% PROTOCOL FEE</text>

  <!-- Main Headline -->
  <text x="32" y="105" class="title">QUILLHOG <tspan class="title-accent">//</tspan> CLAIME</text>

  <!-- Subtitle -->
  <text x="32" y="132" class="sub">100% Non-Custodial Solana Rent Reclaimer · Zero Login · Zero KYC</text>

  <!-- Corner Accents -->
  <path d="M 12 24 L 12 12 L 24 12" class="corner"/>
  <path d="M 788 24 L 788 12 L 776 12" class="corner"/>
  <path d="M 12 176 L 12 188 L 24 188" class="corner"/>
  <path d="M 788 176 L 788 188 L 776 188" class="corner"/>
</svg>
